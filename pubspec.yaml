name: citas_veterinaria
description: Sistema de Gestión de Citas - Clínica Veterinaria
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.0

  # HTTP
  dio: ^5.5.0

  # Almacenamiento seguro
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Fechas
  intl: ^0.19.0
  table_calendar: ^3.1.2

  # Gráficas (reemplaza Chart.js)
  fl_chart: ^0.69.0

  # PDF (historias clínicas)
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4

  # Iconos
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2765.0

  # Utilidades
  json_annotation: ^4.9.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  # NUEVO: Paquete para generar el ícono de la app
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

#  NUEVO: Configuración del ícono de la app
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21